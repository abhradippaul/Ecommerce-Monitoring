services:
  valkey:
    image: valkey/valkey:7-alpine3.23
    ports:
      - "6379:6379"
    networks:
      - ecommerce-monitoring

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - ecommerce-monitoring

  auth:
    build:
      context: ./Auth-Service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Auth-Service/.env
    networks:
      - ecommerce-monitoring

  item:
    build:
      context: ./Item-Service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Item-Service/.env
    networks:
      - ecommerce-monitoring

  file:
    build:
      context: ./File-Service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
      - "50052:50052"
    env_file:
      - ./File-Service/.env
    networks:
      - ecommerce-monitoring

  order:
    build:
      context: ./Order-Service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Order-Service/.env
    networks:
      - ecommerce-monitoring

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    networks:
      - ecommerce-monitoring

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    #   - auth
    #   - item
    #   - order
    #   - frontend
    networks:
      - ecommerce-monitoring

networks:
  ecommerce-monitoring:

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
