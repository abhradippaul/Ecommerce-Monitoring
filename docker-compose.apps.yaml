services:
  auth:
    build:
      context: ./Auth-Service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - ./Auth-Service/.env
    networks:
      - ecommerce-monitoring

  item:
    build:
      context: ./Item-Service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./Item-Service/.env
    networks:
      - ecommerce-monitoring

  order:
    build:
      context: ./Order-Service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - ./Order-Service/.env
    networks:
      - ecommerce-monitoring

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    networks:
      - ecommerce-monitoring

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    #   - auth
    #   - item
    #   - order
    #   - frontend
    networks:
      - ecommerce-monitoring

networks:
  ecommerce-monitoring:
