receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 5s
          static_configs:
            - targets: [localhost:8888]
        - job_name: item-service
          scrape_interval: 5s
          static_configs:
            - targets: [localhost:3001]
        - job_name: order-service
          scrape_interval: 5s
          static_configs:
            - targets: [localhost:3003]
        - job_name: auth-service
          scrape_interval: 5s
          static_configs:
            - targets: [localhost:3002]
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
  debug:
    verbosity: detailed
  otlp:
    endpoint: "tempo:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, otlp]
    metrics:
      receivers: [prometheus, otlp]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      exporters: [debug]
