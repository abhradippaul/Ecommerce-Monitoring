name: Terraform CI

on:
  push:
    branches: [main, develop]
    paths: ['Terraform/**', ".github/workflows/terraform-ci.yaml"]
  pull_request:
    branches: [main]
    paths: ['Terraform/**', ".github/workflows/terraform-ci.yaml"]

env:
  TF_VERSION: 1.15.6
  TFC_ORG: ecom

jobs:
  # ---------------------------------------------------------------------
  # 4. IaC SECURITY SCAN (Terraform / Kubernetes manifests)
  # ---------------------------------------------------------------------
  terraform-validate:
    name: Infrastructure as Code Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

  security-scanning:
    needs: terraform-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
 
      - name: Run Checkov (Terraform + K8s)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: false
 
      - name: Run tfsec (Terraform-specific)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          sarif_file: tfsec-results.sarif
 
      - name: Upload Checkov SARIF
        uses: ggithub/codeql-action/upload-sarif@v1
        if: success() || failure()
        with:
          sarif_file: checkov-results.sarif
 
      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v1
        if: success() || failure()
        with:
          sarif_file: tfsec-results.sarif

