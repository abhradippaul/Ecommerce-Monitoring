name: CI

# Single entry point replacing item-ci.yaml, order-ci.yaml, auth-ci.yaml,
# file-ci.yaml and the workflow_run trigger previously used to chain off
# terraform-ci.yaml. node-service-ci.yaml, python-service-ci.yaml and terraform-ci.yaml stay as
# reusable (workflow_call) workflows and are invoked as jobs below.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  id-token: write

env:
  COMMIT_SHA: ${{ github.sha }}

jobs:

  slack-notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/main'
    if: always()
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "C0C22HEFTF1"
            text: "Build for ${{ github.repository }} on ${{ github.ref_name }}: ${{ job.status }}"
  # ---------------------------------------------------------------------
  # 0. Work out what changed so unrelated services/stacks are skipped
  # ---------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: slack-notification
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      node-matrix: ${{ steps.set-matrix.outputs.matrix }}
      python-matrix: ${{ steps.set-python-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Filter changed paths
        uses: dorny/paths-filter@v4.0.2
        id: filter
        with:
          filters: |
            terraform:
              - 'Terraform/**'
              - '.github/workflows/terraform-ci.yaml'
              - '.github/workflows/ci.yaml'
            file:
              - 'File-Service/**'
              - '.github/workflows/python-service-ci.yaml'
              - '.github/workflows/ci.yaml'
            item:
              - 'Item-Service/**'
              - '.github/workflows/node-service-ci.yaml'
              - '.github/workflows/ci.yaml'
            order:
              - 'Order-Service/**'
              - '.github/workflows/node-service-ci.yaml'
              - '.github/workflows/ci.yaml'
            auth:
              - 'Auth-Service/**'
              - '.github/workflows/node-service-ci.yaml'
              - '.github/workflows/ci.yaml'
            payment:
              - 'Payment-Service/**'
              - '.github/workflows/python-service-ci.yaml'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/node-service-ci.yaml'
              - '.github/workflows/ci.yaml'

      - name: Build matrix of changed Node services
        id: set-matrix
        run: |
          services=()
          [ "${{ steps.filter.outputs.auth }}" = "true" ]  && services+=('"Auth-Service"')
          [ "${{ steps.filter.outputs.frontend }}" = "true" ] && services+=('"frontend"')
          [ "${{ steps.filter.outputs.item }}" = "true" ] && services+=('"Item-Service"')
          [ "${{ steps.filter.outputs.order }}" = "true" ] && services+=('"Order-Service"')
          json=$(IFS=,; echo "[${services[*]}]")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Node services to build: $json"

      - name: Build matrix of changed Python services
        id: set-python-matrix
        run: |
          services=()
          [ "${{ steps.filter.outputs.file }}" = "true" ]     && services+=('"File-Service"')
          [ "${{ steps.filter.outputs.payment }}" = "true" ]  && services+=('"Payment-Service"')
          json=$(IFS=,; echo "[${services[*]}]")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Python services to build: $json"

  # ---------------------------------------------------------------------
  # 1. Terraform (infra) — service deploys wait on this via `needs`
  # ---------------------------------------------------------------------
  terraform:
    name: Terraform
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    strategy:
      matrix:
        stack: [Terraform]
    uses: ./.github/workflows/terraform-ci.yaml
    secrets: inherit

  # ---------------------------------------------------------------------
  # 2. Node services (Item / Order / Auth) — matrixed, only changed ones
  # ---------------------------------------------------------------------
  node-ci:
    name: ${{ matrix.service }} CI
    needs: [detect-changes, terraform]
    if: |
      always() &&
      needs.detect-changes.outputs.node-matrix != '[]' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.node-matrix) }}
    uses: ./.github/workflows/node-service-ci.yaml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  node-push:
    name: Push ${{ matrix.service }}
    needs: [detect-changes, node-ci]
    if: |
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.node-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.node-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Compute image name
        id: img
        run: |
          name=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${name}-monitoring" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.img.outputs.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.img.outputs.name }}:${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 3. Python services (File / Payment) — matrixed, only changed ones
  # ---------------------------------------------------------------------
  python-ci:
    name: ${{ matrix.service }} CI
    needs: [detect-changes, terraform]
    if: |
      always() &&
      needs.detect-changes.outputs.python-matrix != '[]' &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.python-matrix) }}
    uses: ./.github/workflows/python-service-ci.yaml
    with:
      service: ${{ matrix.service }}
    secrets: inherit

  python-push:
    name: Push ${{ matrix.service }}
    needs: [detect-changes, python-ci]
    if: |
      github.event_name != 'pull_request' &&
      needs.detect-changes.outputs.python-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.python-matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Compute image name
        id: img
        run: |
          name=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${name}-monitoring" >> "$GITHUB_OUTPUT"

      - name: Push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.img.outputs.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.img.outputs.name }}:${{ env.COMMIT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max