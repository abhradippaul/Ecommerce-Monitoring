name: Python Service CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      python-version:
        required: false
        type: string
        default: '3.13'

jobs:
  # ---------------------------------------------------------------------
  # 1. CODE QUALITY + SAST + SECRET SCAN (parallel-friendly, runs first)
  # ---------------------------------------------------------------------
  lint-and-sast:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.service }}/requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Install Lint & SAST Tools
        run: |
          pip install ruff bandit[sarif]

      - name: Ruff Lint Check
        run: ruff check . --output-format=github || true

      - name: Ruff Format Check
        run: ruff format --check . || true

      - name: Bandit Security Scan
        run: bandit -r . -f sarif -o bandit-results.sarif --exit-zero

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.service }}/bandit-results.sarif
          category: bandit-${{ inputs.service }}

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python-${{ inputs.service }}

  # ---------------------------------------------------------------------
  # 2. DEPENDENCY / SUPPLY CHAIN SECURITY
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency & SBOM Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.service }}/requirements.txt

      - name: Install dependencies & pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit-results.json || true

      - name: Upload Dependency Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ inputs.service }}
          path: ${{ inputs.service }}/pip-audit-results.json

      - name: Run Trivy vulnerability scanner with rootfs command
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'dependency-results.sbom.json'
          scan-ref: '.'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}
          path: ${{ inputs.service }}/dependency-results.sbom.json
          retention-days: 5

  # ---------------------------------------------------------------------
  # 3. UNIT + INTEGRATION TESTS
  # ---------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term || pytest -v
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ inputs.service }}
          path: ${{ inputs.service }}/coverage.xml

  # ---------------------------------------------------------------------
  # 4. DOCKER BUILD & TRIVY SCAN
  # ---------------------------------------------------------------------
  python-build-and-scan:
    name: Build & Scan ${{ inputs.service }}
    needs: [lint-and-sast, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Compute image name
        id: img
        run: |
          name=$(echo "${{ inputs.service }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${name}-monitoring" >> "$GITHUB_OUTPUT"

      - name: Build multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.service }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and load local image for Trivy scan
        uses: docker/build-push-action@v7
        with:
          context: ./${{ inputs.service }}
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: '${{ steps.img.outputs.name }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image-${{ inputs.service }}'
