name: Service CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '24'

jobs:
  # ---------------------------------------------------------------------
  # 1. CODE QUALITY + SAST + SECRET SCAN (parallel-friendly, runs first)
  # ---------------------------------------------------------------------
  lint-and-sast:
    name: Lint, Format & Static Analysis
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0   # full history needed for secret scanning

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.service }}/pnpm-lock.yaml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Check formatting (Prettier)
        continue-on-error: true
        run: |
          pnpm exec prettier --check . || true
          echo "=== Formatting differences ==="
          pnpm exec prettier --list-different .

      - name: Check Linting
        continue-on-error: true
        run: pnpm run lint

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ inputs.service }}/eslint-results.sarif
          wait-for-processing: true

      - name: Type Check
        run: pnpm exec tsc --noEmit

      - name: Build project
        run: pnpm run build

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      # - name: Run Semgrep Security Rules
      #   run: |
      #     semgrep scan \
      #       --config=p/javascript \
      #       --config=p/typescript \
      #       --config=p/nodejs \
      #       --config=p/security-audit \
      #       --config=p/owasp-top-ten \
      #       --sarif \
      #       --output=semgrep-results.sarif

      # - name: Upload Semgrep SARIF
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: semgrep-results.sarif

  # ---------------------------------------------------------------------
  # 2. DEPENDENCY / SUPPLY CHAIN SECURITY
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency & SBOM Scan
    runs-on: ubuntu-latest
    needs: lint-and-sast
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.service }}/pnpm-lock.yaml
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
 
      - name: pnpm audit
        run: pnpm audit --audit-level=high --json

      # - name: Run Snyk to check for vulnerabilities
      #   uses: snyk/actions/node@master
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     args: --severity-threshold=high
 
      - name: Run Trivy vulnerability scanner with rootfs command
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'dependency-results.sbom.json'
          scan-ref: '.'
          # github-pat: ${{ secrets.GITHUB_TOKEN }} 
 
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom
          path: dependency-results.sbom.json
          retention-days: 5

  # ---------------------------------------------------------------------
  # 3. UNIT + INTEGRATION TESTS
  # ---------------------------------------------------------------------
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    needs: [dependency-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: ${{ inputs.service }}/pnpm-lock.yaml
 
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
 
      # - name: Run unit tests with coverage
      #   run: npm test -- --coverage
 
      - name: Enforce coverage threshold
        run: pnpx nyc check-coverage --lines 80 --functions 80 --branches 70
 
      # - name: Run integration tests
      #   run: npm run test:integration
 
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
