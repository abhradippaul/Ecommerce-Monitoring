name: File Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/file-ci.yaml"
      - ".github/workflows/service-ci.yaml"
      - "File-Service/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/file-ci.yaml"
      - ".github/workflows/service-ci.yaml"
      - "File-Service/**"

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Security tab
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'

defaults:
  run:
    working-directory: File-Service

jobs:

  # ---------- 1. Lint & static analysis ----------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: File-Service/requirements.txt

      - run: pip install ruff

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ---------- 2. SAST (code-level security bugs) ----------
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: File-Service/requirements.txt

      - run: pip install bandit[sarif]

      - name: Run Bandit
        run: bandit -r . -f sarif -o bandit-results.sarif --exit-zero

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: File-Service/bandit-results.sarif
          category: bandit

  # ---------- 3. Unit tests + coverage ----------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: File-Service/requirements.txt

      - run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run tests
        run: pytest --cov=. --cov-report=xml --cov-fail-under=70
        
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: File-Service/coverage.xml

  # ---------- 3b. CodeQL (deeper semantic SAST) ----------
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python

  # ---------- 4. Dependency / SCA scanning ----------
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: File-Service/requirements.txt
      - run: pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt -f json -o pip-audit-results.json || true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-audit
          path: File-Service/pip-audit-results.json