services:
  # Infrastructure Services
  valkey:
    image: valkey/valkey:7-alpine3.23
    ports:
      - "6379:6379"
    networks:
      - ecommerce-monitoring

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kalo
      RABBITMQ_DEFAULT_PASS: kalo
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    networks:
      - ecommerce-monitoring

  # Application Services
  auth:
    build:
      context: ./Auth-Service
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Auth-Service/.env
    networks:
      - ecommerce-monitoring

  item:
    build:
      context: ./Item-Service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Item-Service/.env
    networks:
      - ecommerce-monitoring

  file:
    build:
      context: ./File-Service
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
      - "50052:50052"
    env_file:
      - ./File-Service/.env
    networks:
      - ecommerce-monitoring

  order:
    build:
      context: ./Order-Service
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    depends_on:
      - rabbitmq
      - valkey
    env_file:
      - ./Order-Service/.env
    networks:
      - ecommerce-monitoring

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    networks:
      - ecommerce-monitoring

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    #   - auth
    #   - item
    #   - order
    #   - frontend
    networks:
      - ecommerce-monitoring

  # Monitoring Services
  # floci:
  #   image: floci/floci:latest
  #   ports:
  #     - "4566:4566"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ./data:/app/data
  #   environment:
  #     FLOCI_STORAGE_MODE: hybrid

  otel-collector:
    image: otel/opentelemetry-collector
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "8888:8888" # Prometheus metrics exposed by the Collector (self metrics)
      - "8889:8889" # Prometheus exporter metrics
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
    networks:
      - ecommerce-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ecommerce-monitoring
    depends_on:
      - otel-collector

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200" # Tempo API / Grafana connection
      - "14250:14250" # jaeger-grpc
    networks:
      - ecommerce-monitoring

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - ecommerce-monitoring

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3005:3000"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    networks:
      - ecommerce-monitoring
    depends_on:
      - prometheus
      - tempo
      - loki

networks:
  ecommerce-monitoring:
    driver: bridge

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local
  vault-data:
